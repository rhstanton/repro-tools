# Note: This file is used with --prefix .env, so the 'name' field is ignored
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.9
  - pyyaml>=6.0
  - docopt>=0.6.2
  - pytest>=7.0
  - pytest-cov>=4.0
  - black
  - mypy
  - pip
  # Anything not in conda gets installed via pip in Makefile
