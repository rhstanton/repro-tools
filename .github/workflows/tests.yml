name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.11 is the declared floor (tomllib); 3.12 is what both consumers --
        # project_template and fire -- actually run. Testing only the floor left
        # the version everyone uses unexercised.
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Install GNU Make 4.3+ on macOS
      if: runner.os == 'macOS'
      run: |
        brew install make
        echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

    - name: Verify Make version
      run: make --version | head -1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # Install the DECLARED dev dependencies, rather than restating versions
    # here. The pins live in pyproject.toml [project.optional-dependencies].dev
    # and nowhere else, so a local `uv run` and this job get the same tools.
    #
    # They are pinned at all because an unpinned linter's verdict tracks its own
    # release schedule rather than this repository: the same commit passed for
    # months and then failed when ruff 0.16 stabilized RUF022. A check whose
    # result can change while the code does not is only accidentally a check.
    - name: Install package and dev dependencies
      run: |
        pip install -e '.[dev]'

    - name: Run code quality checks
      env:
        CI: true
      run: |
        make lint
        make format-check
        make type-check

    - name: Run tests
      env:
        CI: true
      run: |
        pip install docopt
        make test

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: |
          .coverage
          htmlcov/
