[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repro-tools"
version = "0.2.0"
description = "Reproducibility tools for research and teaching"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Richard Stanton", email = "stanton@berkeley.edu"}
]
# 3.11, not 3.9: template_update.py imports tomllib, which is stdlib only from
# 3.11. The ">=3.9" claim was false for as long as that import existed --
# `import repro_tools.template_update` raises ModuleNotFoundError on 3.9 and
# 3.10 -- and untested, since CI has only ever run 3.11. Ruff surfaced it
# sideways, by sorting tomllib into third-party imports; the import order was
# the symptom, this line was the bug.
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "docopt>=0.6.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
]

[project.scripts]
repro-record = "repro_tools.cli:record_provenance"
repro-publish = "repro_tools.cli:publish"
repro-compare = "repro_tools.cli:compare"
repro-sysinfo = "repro_tools.cli:sysinfo"
repro-check = "repro_tools.cli:presubmit"
repro-report = "repro_tools.cli:report_gen"
repro-template-diff = "repro_tools.cli:template_diff"

[project.urls]
"Homepage" = "https://github.com/rhstanton/repro-tools"
"Bug Tracker" = "https://github.com/rhstanton/repro-tools/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=repro_tools",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["src/repro_tools"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
files = ["src/repro_tools"]
# Allow missing imports for optional dependencies
ignore_missing_imports = true

# Ruff configuration.
#
# Explicit on purpose, and added 2026-08-16 after its absence caused a CI
# failure that no local run could reproduce. Ruff discovers configuration by
# walking UP from each file, and this repo is normally checked out as a submodule
# inside a project that has a [tool.ruff] block -- so `ruff check` here silently
# inherited that project's rule selection and passed. CI checks this repo out
# standalone, finds no config at all, and falls back to ruff's built-in defaults,
# which flagged 82 errors including RUF022.
#
# Two lessons, both encoded here: a repo that is usually a submodule must carry
# its own config, or it is being linted against whatever happens to be above it;
# and an unpinned linter with no config makes the verdict track the tool's
# default set rather than the code. The workflow pins ruff for the same reason.
[tool.ruff]
line-length = 88
# The package supports 3.9+; lint against the floor, not the newest interpreter.
target-version = "py311"
exclude = [
    ".git",
    ".env",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (import sorting)
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (the formatter owns line length)
]
