[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repro-tools"
version = "0.2.0"
description = "Reproducibility tools for research and teaching"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Richard Stanton", email = "stanton@berkeley.edu"}
]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
]

[project.scripts]
repro-record = "repro_tools.cli:record_provenance"
repro-publish = "repro_tools.cli:publish"
repro-compare = "repro_tools.cli:compare"
repro-sysinfo = "repro_tools.cli:sysinfo"
repro-check = "repro_tools.cli:presubmit"
repro-report = "repro_tools.cli:report_gen"

[project.urls]
"Homepage" = "https://github.com/rhstanton/repro-tools"
"Bug Tracker" = "https://github.com/rhstanton/repro-tools/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
