[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repro-tools"
version = "0.2.0"
description = "Reproducibility tools for research and teaching"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Richard Stanton", email = "stanton@berkeley.edu"}
]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "docopt>=0.6.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
]

[project.scripts]
repro-new-project = "repro_tools.cli:new_project"
repro-record = "repro_tools.cli:record_provenance"
repro-publish = "repro_tools.cli:publish"
repro-compare = "repro_tools.cli:compare"
repro-sysinfo = "repro_tools.cli:sysinfo"
repro-check = "repro_tools.cli:presubmit"
repro-report = "repro_tools.cli:report_gen"

[project.urls]
"Homepage" = "https://github.com/rhstanton/repro-tools"
"Bug Tracker" = "https://github.com/rhstanton/repro-tools/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repro_tools = [
    "templates/**/*",
    "templates/**/.gitignore*",
    "templates/**/.gitattributes*",
    "lib/**/*"
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=repro_tools",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (Julia installation ~5-10 min)",
    "integration: marks tests as integration tests (vs unit tests)",
]

[tool.coverage.run]
source = ["src/repro_tools"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
files = ["src/repro_tools"]
