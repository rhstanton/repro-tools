[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repro-tools"
version = "0.4.0"
description = "Reproducibility tools for research and teaching"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Richard Stanton", email = "stanton@berkeley.edu"}
]
# 3.11, not 3.9: template_update.py imports tomllib, which is stdlib only from
# 3.11. The ">=3.9" claim was false for as long as that import existed --
# `import repro_tools.template_update` raises ModuleNotFoundError on 3.9 and
# 3.10 -- and untested, since CI has only ever run 3.11. Ruff surfaced it
# sideways, by sorting tomllib into third-party imports; the import order was
# the symptom, this line was the bug.
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "docopt>=0.6.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "mypy>=1.0",
]

[project.scripts]
repro-record = "repro_tools.cli:record_provenance"
repro-publish = "repro_tools.cli:publish"
repro-compare = "repro_tools.cli:compare"
repro-sysinfo = "repro_tools.cli:sysinfo"
repro-check = "repro_tools.cli:presubmit"
repro-report = "repro_tools.cli:report_gen"
repro-template-diff = "repro_tools.cli:template_diff"

[project.urls]
"Homepage" = "https://github.com/rhstanton/repro-tools"
"Bug Tracker" = "https://github.com/rhstanton/repro-tools/issues"

[tool.setuptools.packages.find]
where = ["src"]

# The shared build machinery must ship with the package.
#
# src/repro_tools/lib/ holds common.mk, stata.mk and env.sh -- the make targets
# and environment definition that consuming projects include and source. Without
# this stanza setuptools packages only *.py, so `pip install repro-tools`
# installed the Python API and an EMPTY lib/ directory.
#
# Discovered 2026-08-18 while trying to give fire the shared env.sh: fire
# consumes repro-tools as a pinned git dependency rather than as a submodule, so
# the files simply were not there. project_template never noticed because it
# vendors the submodule and reads the files from the source tree, which is the
# one consumer that cannot detect this.
#
# So the whole "one implementation, shared" argument was unavailable to any
# project that installs the package the normal way.
[tool.setuptools.package-data]
repro_tools = ["lib/*.mk", "lib/*.sh"]

# No [tool.black] block. Black was removed in favor of ruff alone, and this
# block outlived it declaring line-length = 100 while [tool.ruff] below says 88.
# Two formatters that disagree on line length do not converge: each reformats
# what the other just wrote, so `make format` produces a diff every time and
# neither verdict is stable. Do not reintroduce it.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=repro_tools",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: spawns git/make subprocesses and may wait on a network timeout",
]

[tool.coverage.run]
source = ["src/repro_tools"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
files = ["src/repro_tools"]
# Allow missing imports for optional dependencies
ignore_missing_imports = true

# Ruff configuration.
#
# Explicit on purpose, and added 2026-08-16 after its absence caused a CI
# failure that no local run could reproduce. Ruff discovers configuration by
# walking UP from each file, and this repo is normally checked out as a submodule
# inside a project that has a [tool.ruff] block -- so `ruff check` here silently
# inherited that project's rule selection and passed. CI checks this repo out
# standalone, finds no config at all, and falls back to ruff's built-in defaults,
# which flagged 82 errors including RUF022.
#
# Two lessons, both encoded here: a repo that is usually a submodule must carry
# its own config, or it is being linted against whatever happens to be above it;
# and an unpinned linter with no config makes the verdict track the tool's
# default set rather than the code. The workflow pins ruff for the same reason.
[tool.ruff]
line-length = 88
# Lint against the floor in requires-python (3.11), not the newest interpreter.
target-version = "py311"
exclude = [
    ".git",
    ".env",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    # Ruff 0.16 formats fenced code blocks inside Markdown, and documentation is
    # prose ABOUT code, not code. Measured 2026-08-17 on a README that documented
    # scaffolding through `str.format()`, where `{{` is an escaped literal brace:
    # ruff read `{{` as a nested dict and "fixed" it into code that does not run,
    # turning
    #     STUDIES = {{ "my_analysis": {{ ... }}, }}
    # into a set containing a dict, and `make format-check` then failed forever.
    #
    # That particular file lived in this repo's own project_template/ copy, which
    # was deleted 2026-08-19 as a dead duplicate of the real template repo. The
    # exclusion stays: the hazard is Markdown-formatting in general, not that one
    # file, and this repo runs ruff as a Python tool.
    "*.md",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (import sorting)
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (the formatter owns line length)
]
